name: Generate pending EF migration once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    env:
      ConnectionStrings__Database: Host=127.0.0.1;Port=54329;Database=municipal_platform;Username=municipal;Password=ci-postgres-only
      DefaultMunicipalitySlug: deodapolis
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MunicipalPlatform.sln

      - name: Restore repository tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build MunicipalPlatform.sln -c Release --no-restore

      - name: Generate pending model migration
        run: dotnet ef migrations add SynchronizePlatformModel --project apps/api/MunicipalPlatform.Api.csproj --startup-project apps/api/MunicipalPlatform.Api.csproj --configuration Release --no-build

      - name: Apply canonical formatting
        run: dotnet format MunicipalPlatform.sln --no-restore

      - name: Verify model is captured
        run: dotnet ef migrations has-pending-model-changes --project apps/api/MunicipalPlatform.Api.csproj --startup-project apps/api/MunicipalPlatform.Api.csproj --configuration Release --no-build

      - name: Commit migration and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/migrate-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "fix(db): capture pending EF model changes"
          git push origin HEAD:main
