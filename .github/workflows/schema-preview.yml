name: schema-preview
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/Modules/**/Domain/**'
      - 'apps/api/Infrastructure/Persistence/ApplicationDbContext.cs'
      - '.github/workflows/schema-preview.yml'
  workflow_dispatch:

# Read-only by default: generated migrations are reviewed before versioning.
permissions:
  contents: read

jobs:
  generate-migration-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore MunicipalPlatform.sln
      - run: dotnet tool restore
      - name: Build before schema generation
        run: dotnet build MunicipalPlatform.sln -c Release --no-restore
      - name: Detect pending model changes
        id: schema
        shell: bash
        run: |
          if dotnet ef migrations has-pending-model-changes --project apps/api --startup-project apps/api --configuration Release --no-build; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate EF migration preview
        if: steps.schema.outputs.pending == 'true'
        run: dotnet ef migrations add MunicipalDepthPreview --project apps/api --startup-project apps/api --output-dir Infrastructure/Persistence/Migrations --configuration Release --no-build
      - uses: actions/upload-artifact@v6
        if: steps.schema.outputs.pending == 'true'
        with:
          name: municipal-depth-migration
          path: apps/api/Infrastructure/Persistence/Migrations
          if-no-files-found: error
