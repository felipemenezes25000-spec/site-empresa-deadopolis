name: dotnet-format-fix
on:
  pull_request:
permissions:
  contents: write
concurrency:
  group: dotnet-format-fix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet restore MunicipalPlatform.sln
      - name: Apply dotnet format
        run: dotnet format MunicipalPlatform.sln --no-restore
      - name: Remove this temporary workflow
        run: rm .github/workflows/dotnet-format-fix.yml
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(dotnet): apply repository formatting"
          git push origin HEAD:${{ github.head_ref }}
