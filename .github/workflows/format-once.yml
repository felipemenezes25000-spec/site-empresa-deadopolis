name: Format once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MunicipalPlatform.sln

      - name: Apply canonical .NET formatting
        run: dotnet format MunicipalPlatform.sln --no-restore

      - name: Commit formatter output and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "fix(ci): apply canonical dotnet formatting"
          git push origin HEAD:main
