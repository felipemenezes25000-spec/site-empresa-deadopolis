name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: municipal_platform, POSTGRES_USER: municipal, POSTGRES_PASSWORD: ci-postgres-only }
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U municipal -d municipal_platform"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      ConnectionStrings__Database: Host=127.0.0.1;Port=54329;Database=municipal_platform;Username=municipal;Password=ci-postgres-only
      DefaultMunicipalitySlug: deodapolis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet restore MunicipalPlatform.sln
      - run: dotnet build MunicipalPlatform.sln -c Release --no-restore
      - run: dotnet test MunicipalPlatform.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Restore repository tools
        run: dotnet tool restore
      - name: Fresh database migration
        run: dotnet ef database update --project apps/api/MunicipalPlatform.Api.csproj --startup-project apps/api/MunicipalPlatform.Api.csproj --configuration Release --no-build
      - name: Migration script verification
        run: |
          dotnet ef migrations script --idempotent --project apps/api/MunicipalPlatform.Api.csproj --startup-project apps/api/MunicipalPlatform.Api.csproj --configuration Release --no-build > /tmp/migrations.sql
          test -s /tmp/migrations.sql
      - name: EF model snapshot verification
        run: dotnet ef migrations has-pending-model-changes --project apps/api/MunicipalPlatform.Api.csproj --startup-project apps/api/MunicipalPlatform.Api.csproj --configuration Release --no-build
      - name: Vulnerable NuGet packages
        run: dotnet list MunicipalPlatform.sln package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-results, path: "**/TestResults/*.trx", if-no-files-found: ignore }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env: { API_URL: http://127.0.0.1:5080, MUNICIPALITY_SLUG: deodapolis, PUBLIC_PORTAL_URL: http://127.0.0.1:3000 }
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: ./scripts/secret-scan.sh
      - name: Reject certificate/private key artifacts
        run: test -z "$(find . -type f \( -name '*.pfx' -o -name '*.p12' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' -print -quit)"
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t municipal-api:ci .
      - run: docker build -f apps/web/Dockerfile -t municipal-web:ci .
      - name: Validate compose configuration with ephemeral credentials
        run: |
          export POSTGRES_PASSWORD=$(openssl rand -hex 16)
          export DEMO_PASSWORD=$(openssl rand -hex 24)
          docker compose config >/dev/null
  e2e:
    runs-on: ubuntu-latest
    needs: [containers]
    env:
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Prepare ephemeral POC credentials
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "DEMO_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start POC environment
        run: docker compose up -d --build
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5080/health/live >/dev/null && curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 2; done
          docker compose logs
          exit 1
      - run: npm run test:e2e
        working-directory: apps/web
      - name: Container logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-evidence, path: "apps/web/playwright-report\napps/web/test-results\ncompose.log", if-no-files-found: ignore }
      - if: always()
        run: docker compose down -v --remove-orphans
